<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Práctica Ethical Hacker – Examen final</title>
<style>
:root{--bg:#eef1f8;--card:#fff;--tx:#161b2e;--mu:#667085;--bd:#dfe3ee;--ac:#4f46e5;--ac2:#7c3aed;--ok:#15803d;--okb:#dcfce7;--ko:#b91c1c;--kob:#fee2e2;--sh:0 10px 34px rgba(31,41,90,.09);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1020;--card:#151b30;--tx:#e8ebf5;--mu:#98a2b8;--bd:#283049;--ac:#818cf8;--ac2:#a78bfa;--ok:#4ade80;--okb:#10301f;--ko:#f87171;--kob:#3a1519;--sh:0 10px 34px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 420px at 8% -8%,color-mix(in srgb,var(--ac) 16%,transparent),transparent),var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:18px 16px 40px}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em;flex:none}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px}.brand b{display:block;font-size:17px;line-height:1.2}.brand small{color:var(--mu)}
.lg2{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 40%,transparent)}
.pill{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:5px 14px;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;box-shadow:var(--sh)}.pill:empty{display:none}
.top{margin-top:18px;color:var(--mu);font-size:12px;letter-spacing:.08em;text-transform:uppercase;min-height:18px}
.bar{height:7px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:6px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:24px;margin-top:14px;box-shadow:var(--sh)}
.card.enter{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.98)}50%{transform:scale(1.015)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
h2{font-size:19px;line-height:1.45;margin:0 0 16px}
img{max-width:100%;height:auto;display:block;margin:12px 0;border:1px solid var(--bd);border-radius:10px;background:#fff}
.o{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:14px;padding:12px 14px;margin:10px 0;font:inherit;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s,background .15s}
.o:hover:not(:disabled){transform:translateY(-1px);border-color:var(--ac);box-shadow:0 6px 18px color-mix(in srgb,var(--ac) 16%,transparent)}
.o:active:not(:disabled){transform:scale(.99)}
.lt{font-style:normal;flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--bg);color:var(--mu);border:1px solid var(--bd);transition:all .15s}
.o.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 9%,var(--card))}.o.sel .lt{background:var(--ac);color:#fff;border-color:var(--ac)}
.o.ok{background:var(--okb);border-color:var(--ok);animation:pop .35s}.o.ok .lt{background:var(--ok);color:#fff;border-color:var(--ok)}
.o.ko{background:var(--kob);border-color:var(--ko);animation:shake .4s}.o.ko .lt{background:var(--ko);color:#fff;border-color:var(--ko)}
.o:disabled{cursor:default}
.btn{display:inline-block;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:12px;padding:12px 26px;font:inherit;font-weight:600;cursor:pointer;margin-top:14px;transition:transform .15s,box-shadow .15s,opacity .15s;box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 35%,transparent)}
.btn:hover:not(:disabled){transform:translateY(-2px)}.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.fb{display:flex;gap:10px;align-items:center;margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:600;animation:rise .3s ease both}
.fb.ok{background:var(--okb);color:var(--ok)}.fb.ko{background:var(--kob);color:var(--ko)}.fb.in{background:var(--bd);color:var(--tx)}
.ex{margin-top:12px;padding:12px 14px;border-left:4px solid var(--ac);background:color-mix(in srgb,var(--ac) 7%,var(--card));border-radius:8px;font-size:15px;animation:rise .35s ease both}
.mkb{display:inline-flex;gap:6px;align-items:center;background:none;border:1px solid var(--bd);color:var(--mu);border-radius:999px;padding:5px 14px;font:inherit;font-size:13px;cursor:pointer;margin-bottom:12px;transition:all .15s}
.mkb:hover{border-color:var(--ac);color:var(--ac)}.mkb.on{color:var(--ac);border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,var(--card))}
.mt{margin:12px 0;padding:12px;border:1.5px solid var(--bd);border-radius:14px;transition:all .2s}.mt b{display:block;margin-bottom:8px}
.mt select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
.mt.ok{background:var(--okb);border-color:var(--ok)}.mt.ko{background:var(--kob);border-color:var(--ko)}.mc{color:var(--ok);font-size:14px;margin-top:8px}
.ng{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:16px}
.nb{position:relative;padding:7px 0;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:9px;cursor:pointer;font:inherit;font-size:13px;transition:transform .12s,border-color .12s}
.nb:hover{transform:translateY(-2px);border-color:var(--ac)}.nb.ok{background:var(--okb);border-color:var(--ok)}.nb.ko{background:var(--kob);border-color:var(--ko)}.nb.cur{outline:2px solid var(--ac);outline-offset:1px}
.nb.mkd::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--ac2)}
.lg{display:flex;gap:16px;flex-wrap:wrap;color:var(--mu);font-size:13px;margin:10px 0 0}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;border:1px solid var(--bd)}.dot.ok{background:var(--okb);border-color:var(--ok)}.dot.ko{background:var(--kob);border-color:var(--ko)}.dot.mk{background:var(--ac2);border-radius:50%}
.hero h1{margin:0;font-size:26px}.hero p{margin:4px 0 18px;color:var(--mu)}
.sts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.st{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center}.st b{display:block;font-size:22px;line-height:1.2}.st small{color:var(--mu);font-size:12px}
.mds{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.md{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:16px;padding:16px;font:inherit;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s}
.md:hover{transform:translateY(-3px);border-color:var(--ac);box-shadow:0 10px 24px color-mix(in srgb,var(--ac) 18%,transparent)}
.md .mi{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:color-mix(in srgb,var(--ac) 13%,var(--card));color:var(--ac)}
.md b{display:block}.md small{color:var(--mu);font-size:13px;line-height:1.4;display:block;margin-top:2px}
.lnk{background:none;border:0;color:var(--mu);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;margin-top:16px;padding:0}.lnk:hover{color:var(--ko)}
.ring{position:relative;width:170px;height:170px;margin:4px auto 14px}.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.rb{fill:none;stroke:var(--bd);stroke-width:10}.rf{fill:none;stroke:var(--ac);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.rt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.rt b{font-size:44px;line-height:1}.rt small{color:var(--mu)}
@media(max-width:560px){.mds{grid-template-columns:1fr}.sts{grid-template-columns:repeat(2,1fr)}.card{padding:18px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main>

function mHtml(q){const P=M[q[0]],mp=shuffle(P.map((p,k)=>k));let h='';
 P.forEach((p,k)=>{h+='<div class="mt" id="mr'+k+'"><b>'+esc(p[0])+'</b><select data-k="'+k+'"><option value="">— elige la descripción —</option>'+mp.map(j=>'<option value="'+j+'">'+esc(P[j][1])+'</option>').join("")+'</select></div>'});
 return h+'<div id="fb"></div><button class="btn" id="go" disabled>Comprobar</button>'}
function mInit(){const q=L[i],P=M[q[0]],ss=[...$("c").querySelectorAll("select")];
 ss.forEach(s=>s.onchange=()=>{$("go").disabled=done||ss.some(x=>!x.value)});
 $("go").onclick=()=>{if(done){next();return}
  const good=ss.every(s=>s.value==s.dataset.k);graded++;if(good)ok++;rec(L[i].id,good);
  if(mode=="e"){res.push({q:L[i],good});next();return}
  done=true;ss.forEach(s=>{s.disabled=true;const r=$("mr"+s.dataset.k),c=s.value==s.dataset.k;r.classList.add(c?"ok":"ko");if(!c)r.insertAdjacentHTML("beforeend",'<div class="mc">Correcta: '+esc(P[s.dataset.k][1])+'</div>')});
  $("fb").innerHTML='<div class="fb '+(good?"ok":"ko")+'">'+(good?IC.ok+"¡Correcto!":IC.ko+"Hay errores. Abajo está la respuesta original.")+'</div>'+exp(q.id)+'<img alt="" src="'+IMG[q[0]]+'">';
  $("sc").textContent="Aciertos: "+ok+" / "+graded;$("go").disabled=false;$("go").textContent=i==L.length-1?"Ver resultado":"Siguiente"};
 if(mode=="e")$("go").textContent=i==L.length-1?"Terminar":"Siguiente"}
function show(){
 const q=L[i],opts=q.slice(2),m=!opts.length;sel=new Set();done=false;
 $("n").textContent=(mode=="e"?"Examen · ":"")+"Pregunta "+(i+1)+" de "+L.length;$("sc").textContent=mode=="e"?"Tiempo "+fmt():"Aciertos: "+ok+" / "+graded;$("pb").style.width=(i/L.length*100)+"%";
 let h="<h2>"+(i+1)+". "+esc(q[1])+"</h2>"+(q[0]&&!m?'<img alt="" src="'+IMG[q[0]]+'">':"");
 if(m)h+=mHtml(q);
 else{opts.forEach((o,k)=>h+='<button class="o" data-k="'+k+'"><em class="lt">'+"ABCDEFGH"[k]+'</em><span>'+esc(o.replace(/^\*/,""))+'</span></button>');
  h+='<div id="fb"></div><button class="btn" id="go" disabled>Comprobar</button>';}
 $("c").innerHTML=h;window.scrollTo(0,0);mkBtn();navDraw();anim();
 if(m)mInit();if(!m){const need=opts.filter(o=>o[0]=="*").length;
  $("c").querySelectorAll(".o").forEach(b=>b.onclick=()=>{if(done)return;const k=+b.dataset.k;
   if(need==1){sel=new Set([k]);}else{sel.has(k)?sel.delete(k):sel.add(k);}
   $("c").querySelectorAll(".o").forEach(x=>x.classList.toggle("sel",sel.has(+x.dataset.k)));
   if(need==1&&mode=="p")check(opts);else $("go").disabled=sel.size!=need;});
  $("go").onclick=()=>done?next():check(opts);if(mode=="e")$("go").textContent=i==L.length-1?"Terminar":"Siguiente";
  if(need==1&&mode=="p")$("go").style.display="none";}
}
function check(opts){done=true;graded++;
 const cor=opts.map((o,k)=>o[0]=="*"?k:-1).filter(k=>k>=0),good=cor.length==sel.size&&cor.every(k=>sel.has(k));
 if(good)ok++;rec(L[i].id,good);if(mode=="e"){res.push({q:L[i],sel:[...sel],good});next();return}
 $("c").querySelectorAll(".o").forEach(b=>{const k=+b.dataset.k;b.disabled=true;b.classList.remove("sel");
  if(cor.includes(k))b.classList.add("ok");else if(sel.has(k))b.classList.add("ko");});
 $("fb").innerHTML='<div class="fb '+(good?"ok":"ko")+'">'+(good?IC.ok+"¡Correcto!":IC.ko+"Incorrecto. Las respuestas correctas están en verde.")+"</div>"+exp(L[i].id);
 $("sc").textContent="Aciertos: "+ok+" / "+graded;
 const g=$("go");g.style.display="";g.disabled=false;g.textContent=i==L.length-1?"Ver resultado":"Siguiente";}
function next(){i++;i>=L.length?end():show()}
function end(){clearInterval(tm);$("nav").innerHTML="";$("pb").style.width="100%";$("n").textContent="Terminado";
 let h='<div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="rb"/><circle cx="60" cy="60" r="52" class="rf" id="rf" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg><div class="rt"><b id="rn">0</b><small>de '+graded+' · '+(graded?Math.round(ok/graded*100):0)+'%</small></div></div>';
 if(mode=="e"){h+='<p style="text-align:center">Tiempo: '+fmt()+' · '+Math.round(ok/graded*100)+'%</p>';const bad=res.filter(r=>!r.good);
  if(bad.length){h+='<h2>Preguntas falladas</h2>';bad.forEach(r=>{h+='<p><b>'+esc(r.q[1])+'</b></p>'+exp(r.q.id)+(r.q[0]?'<img alt="" src="'+IMG[r.q[0]]+'">':'');r.q.slice(2).forEach((o,k)=>{const c=o[0]=="*",s=r.sel.includes(k);h+='<div class="o '+(c?"ok":s?"ko":"")+'" style="cursor:default"><span>'+(c?IC.ok:s?IC.ko:"")+esc(o.replace(/^\*/,""))+'</span></div>'})})}
  else h+='<p style="text-align:center">¡Sin errores!</p>'}
 else h+='<p style="text-align:center">Respuestas correctas.</p>';
 h+='<button class="btn" onclick="menu()">Volver al menú</button>';$("c").innerHTML=h;window.scrollTo(0,0);anim();ringAnim(ok,graded)}
document.addEventListener("keydown",e=>{if(e.target.tagName=="SELECT")return;const o=[...$("c").querySelectorAll("button.o[data-k]")];
 if(e.key=="Enter"){const g=$("go");if(g&&g.offsetParent&&!g.disabled){e.preventDefault();g.click()}}
 else if(/^[1-9]$/.test(e.key)&&o[e.key-1]&&!o[e.key-1].disabled)o[e.key-1].click()});
menu();
